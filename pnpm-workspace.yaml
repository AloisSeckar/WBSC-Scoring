shamefullyHoist: true

allowBuilds:
  '@parcel/watcher': true
  'sharp': true
  'unrs-resolver': true
  'esbuild': false
  'maplibre-gl': false
  'vue-demi': false

minimumReleaseAgeExclude:
  # nuxt-ignis and its submodules must be excluded to allow 
  # installing latest version without cooldown
  - 'nuxt-ignis'
  - 'nuxt-spec'
  - '@nuxt-ignis/content'
  - '@nuxt-ignis/default'
  - '@nuxt-ignis/db'
  - '@nuxt-ignis/forms'
  - '@nuxt-ignis/ui'
  - '@nuxt-ignis/utils'
  - '@nuxt-ignis/validation'

overrides:
  # pnpm audit fix @ 2026-10-17
  '@simple-git/argv-parser@<2.0.1': ^2.0.1
  '@tiptap/core@>=2.0.0-alpha.0 <3.30.4': ^3.30.4
  '@tiptap/core@>=3.7.0 <3.30.5': ^3.30.5
  '@vitest/mocker@>=2.1.0 <4.1.11': ^4.1.11
  '@vue/server-renderer@<3.5.42': ^3.5.42
  axios@>=1.0.0 <1.20.0: ^1.20.0
  brace-expansion@<1.1.21: ^1.1.21
